application:
  subdomain: foliospace-library
  multi_instance: true
  upstreams:
    - location: /
      backend: http://foliospace-library:8080/
  injects:
    - id: foliospace-login-autofill
      on: browser
      when:
        - /
        - /*
      do:
        - src: builtin://simple-inject-password
          params:
            password: "{{ .U.api_token }}"
            requireUser: false
            allowPasswordOnly: true
            passwordSelector: ".authPanel:not(.setupPanel) input[type='password']"
            autoSubmit: true
    - id: foliospace-setup-token-autofill
      on: browser
      when:
        - /
        - /*
      do:
        - src: builtin://simple-inject-password
          params:
            password: "{{ .U.api_token }}"
            requireUser: false
            allowPasswordOnly: true
            passwordSelector: ".setupPanel input[type='password']"
            autoSubmit: false
    - id: foliospace-file-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  foliospace-library:
    # upstream: docker.io/funland/foliospace-library:1.01
    image: docker.1ms.run/funland/foliospace-library:1.01
    environment:
      - FOLIOSPACE_CONFIG_DIR=/config
      - FOLIOSPACE_LIBRARY_DIR=/library
      - FOLIOSPACE_DIRECTORY_ROOTS=/library,/books,/games,/videos
      - FOLIOSPACE_ADDR=:8080
      - "FOLIOSPACE_API_TOKEN={{ .U.api_token }}"
      - FOLIOSPACE_SCAN_WORKERS=2
      - FOLIOSPACE_MEMORY_LIMIT_MB=768
    binds:
      - /lzcapp/var/config:/config
      - "/lzcapp/documents/{{ .S.DeployUID }}/library:/library"
      - "/lzcapp/documents/{{ .S.DeployUID }}/books:/books"
      - "/lzcapp/documents/{{ .S.DeployUID }}/games:/games"
      - "/lzcapp/documents/{{ .S.DeployUID }}/videos:/videos"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/api/setup/status
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
usage: |
  每位懒猫用户会获得独立的 FolioSpace 实例、配置数据库和访问令牌，无需选择用户 UID。
  首次打开时，从 /library、/books、/games 或 /videos 中选择一个目录完成初始化；这些只读媒体目录位于当前用户的应用文稿中，卸载应用时默认保留。
  本应用仅索引和访问用户自行提供的内容，不包含或分发任何电子书、漫画、游戏或视频资源。
